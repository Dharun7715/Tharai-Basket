services:
  - type: web
    name: tharai-basket
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: FREE_DELIVERY_THRESHOLD
        value: 300
      - key: DELIVERY_FEE
        value: 25
      - key: MIN_ORDER_VALUE
        value: 100
      - key: DELIVERY_CENTER_LAT
        value: 11.69522
      - key: DELIVERY_CENTER_LON
        value: 77.96991
      - key: DELIVERY_RADIUS_KM
        value: 5
      - key: DATABASE_URL
        fromDatabase:
          name: tharai-basket-db
          property: connectionString
databases:
  - name: tharai-basket-db
    plan: free
    databaseName: tharaibasket
    user: tharaibasket
