services:
  - type: web
    name: tharai-basket
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: SECRET_KEY
        generateValue: true
      - key: FREE_DELIVERY_THRESHOLD
        value: 200
      - key: DELIVERY_FEE
        value: 20
      - key: MIN_ORDER_VALUE
        value: 100
      - key: DATABASE_URL
        fromDatabase:
          name: tharai-basket-db
          property: connectionString
databases:
  - name: tharai-basket-db
    databaseName: tharaibasket
    user: tharaibasket
