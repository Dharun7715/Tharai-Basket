{% extends 'admin/base_admin.html' %}{% block title %}Edit {{ product.name }} | Tharai Basket{% endblock %}{% block admin_content %}<div class="admin-top"><div><span class="eyebrow">CATALOGUE / EDIT</span><h1>Edit product</h1><p class="muted">Update product details, price and availability.</p></div><a class="text-link" href="{{ url_for('admin_products') }}">← Back to products</a></div><div class="admin-panel"><form method="post" enctype="multipart/form-data" class="admin-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Product name<input name="name" value="{{ product.name }}" required></label><label>Brand<input name="brand" value="{{ product.brand }}"></label><label>Unit<input name="unit" value="{{ product.unit }}"></label><label>Category<select name="category_id"><option value="">Choose category</option>{% for c in categories %}<option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>MRP (₹)<input type="number" name="mrp" min="0" step="0.01" value="{{ product.mrp }}" required></label><label>Selling price (₹)<input type="number" name="price" min="0.01" step="0.01" value="{{ product.price }}" required></label><label>Available stock<input type="number" name="stock" min="0" value="{{ product.stock }}"></label><label>Replace image<input type="file" name="image" accept="image/png,image/jpeg,image/webp"></label><label class="span-two">Description<textarea name="description" rows="3">{{ product.description }}</textarea></label><label class="check-label"><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Active</label><label class="check-label"><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %}> Featured</label><button class="btn">Save changes</button></form></div>{% endblock %}
